<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卷帙 DeShelf · Web</title>
<meta name="description" content="本地 TXT 整理工具 — 扫描 · 清洗 · 分章 · 导出 EPUB / TXT。纯本地运行，不上传任何数据。">
<style>
:root{
  --bg:#e4e6e8; --panel:#f2f3f5; --card:#fafbfc; --line:#c9ccd1; --line2:#d8dade;
  --ink:#232629; --muted:#5f6670; --faint:#8b919a;
  --blue:#2f6fb0; --blue-d:#24598f; --green:#2e8b57; --green-d:#237043;
  --amber:#c07a12; --red:#c0392b; --tag:#eef1f4;
  --shadow:0 1px 3px rgba(0,0,0,.12);
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;}
button{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
a{color:var(--blue)}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px}
.logo{font-size:20px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.logo .cn{color:var(--blue)}
.logo .en{color:var(--muted);font-weight:600;font-size:16px}
.ver{background:var(--tag);color:var(--muted);border-radius:20px;padding:1px 10px;font-size:12px}
.spacer{flex:1}
header button{background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:5px 12px;cursor:pointer;color:var(--ink)}
header button:hover{border-color:var(--blue);color:var(--blue)}
header button.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- steps nav ---------- */
nav.steps{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:6px;box-shadow:var(--shadow);margin-bottom:12px;flex-wrap:wrap}
nav.steps .st{flex:1;min-width:120px;text-align:center;padding:8px 6px;cursor:pointer;
  border-radius:var(--r);color:var(--muted);user-select:none;border:1px solid transparent}
nav.steps .st b{display:block;font-size:12px;font-weight:600}
nav.steps .st i{font-style:normal;font-size:13px}
nav.steps .st:hover{background:var(--card)}
nav.steps .st.act{background:var(--card);border-color:var(--line2);color:var(--ink);box-shadow:var(--shadow)}
nav.steps .st.act b{color:var(--blue)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;
  border-bottom:1px solid var(--line2);background:var(--card)}
.card>.hd h2{margin:0;font-size:15px}
.card>.hd .sub{color:var(--muted);font-size:12px}
.card>.bd{padding:12px 14px}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{display:inline-block;border:1px solid transparent;border-radius:var(--r);
  padding:7px 16px;cursor:pointer;color:#fff;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.b1{background:var(--blue)} .btn.b1:hover:not(:disabled){background:var(--blue-d)}
.btn.b2{background:var(--green)} .btn.b2:hover:not(:disabled){background:var(--green-d)}
.btn.b3{background:var(--amber)} .btn.b3:hover:not(:disabled){background:#9a610c}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn.sm{padding:3px 10px;font-size:12px;font-weight:500}
.btn.danger{background:var(--red)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{margin-top:8px;padding:6px 10px;border-radius:var(--r);font-size:13px}
.msg.ok{background:#e3f2e8;color:#1d6b3f}
.msg.warn{background:#fdeeda;color:#8a5a10}
.msg.err{background:#fbe3e0;color:#96281c}

/* ---------- table ---------- */
.tblwrap{overflow:auto;max-height:430px;border:1px solid var(--line2);border-radius:var(--r);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
.tbl th{position:sticky;top:0;background:#eceef0;z-index:1;font-weight:600;color:var(--muted)}
.tbl tr:hover td{background:#f4f7fb}
.tbl tr.dup td.name{color:var(--amber)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .name{max-width:260px;overflow:hidden;text-overflow:ellipsis}
.tbl .auth{max-width:100px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tag{display:inline-block;background:var(--tag);border-radius:4px;padding:0 6px;font-size:11px;color:var(--muted)}
.tag.red{background:#fbe3e0;color:var(--red)}

/* ---------- misc form ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rule{border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;background:#fff;cursor:pointer}
.rule:hover{border-color:var(--blue)}
.rule.on{border-color:var(--green);background:#f0f8f2}
.rule input{accent-color:var(--green);margin-right:6px}
.rule .t{font-weight:600}
.rule .d{color:var(--muted);font-size:12px}
.pane2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:900px){.pane2{grid-template-columns:1fr}}
.pane{border:1px solid var(--line2);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:180px}
.pane .pt{background:#eceef0;padding:4px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.pane pre{margin:0;padding:10px;overflow:auto;font:12px/1.7 Consolas,"Courier New",monospace;white-space:pre-wrap;word-break:break-all;flex:1;max-height:340px}
.pane pre .del{color:var(--red)}
.pane pre .add{color:var(--green)}
fieldset{border:1px solid var(--line2);border-radius:var(--r);padding:8px 12px;margin:0 0 10px}
legend{font-size:13px;color:var(--muted);padding:0 6px}
.inp{border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font:inherit;
  background:#fff;color:var(--ink);width:100%}
.inp:focus{outline:none;border-color:var(--blue)}
label.lab{font-size:13px;color:var(--muted)}
.select{font:inherit;border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:#fff;max-width:100%}
.check{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.check label{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:14px}
.check input{accent-color:var(--blue)}

/* ---------- chapter list ---------- */
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px;
  max-height:300px;overflow:auto;border:1px solid var(--line2);border-radius:var(--r);padding:8px;background:#fff}
.chlist .ch{font-size:12px;color:var(--muted);padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chlist .ch:nth-child(odd){background:#f6f7f8}
.chlist .ch:first-child{color:var(--blue);font-weight:600}

/* ---------- dropzone ---------- */
.dz{border:2px dashed var(--line);border-radius:var(--r);background:var(--card);
  padding:26px 14px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.dz:hover,.dz.over{border-color:var(--blue);background:#f2f6fb;color:var(--blue)}
.dz .big{font-size:15px;font-weight:600}

/* ---------- log ---------- */
.logbar{background:#1f2428;color:#c8d0d6;border-radius:var(--r);margin-top:4px;
  font:12px/1.6 Consolas,monospace}
.logbar .lt{padding:4px 12px;color:#7fd0a0;cursor:pointer;user-select:none;font-size:12px}
.logbar pre{margin:0;padding:0 12px 10px;max-height:170px;overflow:auto;white-space:pre-wrap}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(20,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,.25);
  width:min(620px,92vw);max-height:86vh;display:flex;flex-direction:column}
.dlg .dh{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line2);display:flex;align-items:center}
.dlg .dh .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px}
.dlg .db{padding:14px 16px;overflow:auto}
.dlg .df{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px}

.dz-inline{display:inline-block;border:1px dashed var(--line);border-radius:var(--r);padding:6px 18px;color:var(--muted)}
.dz-inline.over{border-color:var(--blue);color:var(--blue);background:#eef4fb}
.prog{height:10px;background:#dfe2e5;border-radius:6px;overflow:hidden;margin-top:8px;display:none}
.prog>div{height:100%;width:0;background:var(--green);transition:width .2s}
h3{font-size:14px;margin:4px 0 8px}
.hint{color:var(--faint);font-size:12px;margin-top:4px}
.stat{margin-top:10px;text-align:center;font-size:12px;color:var(--faint);display:none}
.stat b{color:var(--muted);font-weight:400}
.row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
b.dark{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><span class="cn">卷帙</span> <span class="en">DeShelf</span></div>
  <span class="ver">v1.5.8</span>
  <span class="spacer"></span>
  <button id="btnLang" title="Switch language / 切换语言">EN</button>
  <button id="btnHelp">帮助 Help</button>
  <button id="btnAbout">关于 About</button>
</header>

<nav class="steps" id="stepNav">
  <div class="st act" data-i="0"><i>①</i><b data-k="nav1">书库</b></div>
  <div class="st" data-i="1"><i>②</i><b data-k="nav2">清洗</b></div>
  <div class="st" data-i="2"><i>③</i><b data-k="nav3">分章</b></div>
  <div class="st" data-i="3"><i>④</i><b data-k="nav4">导出</b></div>
</nav>

<!-- ================= ① 书库 ================= -->
<section class="card" id="pane0">
  <div class="hd"><h2 data-k="libTitle">① 书库</h2>
    <span class="sub" data-k="libSub"></span>
    <span class="spacer" style="flex:1"></span>
    <span id="modeTag"></span>
  </div>
  <div class="bd">
    <div class="btnrow" style="margin-bottom:10px">
      <button class="btn b1" id="btnPickDir" data-k="btnPickDir">📁 选择文件夹</button>
      <span class="btn ghost" id="btnPickFiles" data-k="btnPickFiles">📂 选择 TXT 文件…</span>
    </div>
    <div class="dz" id="dz">
      <div class="big" data-k="dzTitle">把 TXT 文件或文件夹拖到这里</div>
      <div data-k="dzSub"></div>
    </div>
    <div class="hint" id="modeHint" style="margin:8px 0 0"></div>
    <div class="btnrow" style="margin:10px 0 6px" id="libTools">
      <button class="btn ghost sm" id="btnScan" data-k="btnRescan" disabled>🔄 重新扫描</button>
      <button class="btn ghost sm" id="btnSelAll" data-k="btnSelAll" disabled>全选</button>
      <button class="btn ghost sm" id="btnSelInv" data-k="btnSelInv" disabled>反选</button>
      <button class="btn ghost sm" id="btnSelDup" data-k="btnSelDup" disabled>只选重复</button>
      <button class="btn ghost sm" id="btnClear" data-k="btnClear" disabled>清空列表</button>
      <button class="btn ghost sm" id="btnCsv" data-k="btnCsv" disabled>导出书单 CSV</button>
      <span class="hint" id="libInfo" style="margin:0 0 0 auto"></span>
    </div>
    <div class="tblwrap"><table class="tbl" id="libTbl"></table></div>
  </div>
</section>

<!-- ================= ② 清洗 ================= -->
<section class="card hidden" id="pane1">
  <div class="hd"><h2 data-k="cleanTitle">② 批量清洗</h2>
    <span class="spacer" style="flex:1"></span>
    <button class="btn ghost sm" id="btnRulesImport" data-k="btnRulesImport">导入规则</button>
    <button class="btn ghost sm" id="btnRulesExport" data-k="btnRulesExport">导出规则</button>
    <button class="btn ghost sm" id="btnRulesCustom" data-k="btnRulesCustom">自定义规则</button>
    <button class="btn ghost sm" id="cleanReset" data-k="cleanReset">恢复默认勾选</button>
    <input type="file" id="rulesFile" accept=".json,application/json" style="display:none">
  </div>
  <div class="bd">
    <div class="grid2" id="ruleBox"></div>
    <div class="btnrow" style="margin-top:10px">
      <button class="btn b1" id="btnCleanPrev" data-k="btnCleanPrev">预览清洗效果</button>
      <button class="btn b2" id="btnCleanApply" data-k="btnCleanApply">应用到所选书籍</button>
      <span class="hint" id="cleanInfo"></span>
    </div>
    <div class="pane2" id="cleanPane" style="margin-top:10px"></div>
  </div>
</section>

<!-- ================= ③ 分章 ================= -->
<section class="card hidden" id="pane2">
  <div class="hd"><h2 data-k="chapTitle">③ 智能分章</h2>
    <span class="spacer" style="flex:1"></span>
    <button class="btn ghost sm" id="chapReHelp" data-k="reHelp">常用写法</button>
    <button class="btn ghost sm" id="chapReset" data-k="chapReset">内置规则</button>
  </div>
  <div class="bd">
    <div class="row2" style="margin-bottom:8px">
      <span class="lab" data-k="chapPick">选择一本书试分</span>
      <select class="select" id="chapBook" style="min-width:260px"></select>
      <button class="btn b1" id="btnChapTry" data-k="btnChapTry">试分章节</button>
      <button class="btn b2" id="btnChapApply" data-k="btnChapApply">应用分章到该书</button>
      <span class="hint" id="chapInfo"></span>
    </div>
    <fieldset>
      <legend data-k="chapCustom">自定义章节正则（留空 = 用内置规则库）</legend>
      <input class="inp" id="chapRegex" placeholder="如：第[0-9零一二三四五六七八九十百千万]+[章节回卷篇]" spellcheck="false">
    </fieldset>
    <fieldset>
      <legend data-k="bookRe">本书专用规则（留空 = 用上面的全局正则）</legend>
      <input class="inp" id="bookRegex" placeholder="" spellcheck="false">
    </fieldset>
    <div class="row2" style="margin:8px 0">
      <button class="btn b2" id="btnChapAll" data-k="btnChapAll">⚡ 全部书籍一键分章</button>
      <span class="hint" id="chapAllInfo"></span>
    </div>
    <div class="chlist" id="chapList"></div>
  </div>
</section>

<!-- ================= ④ 导出 ================= -->
<section class="card hidden" id="pane3">
  <div class="hd"><h2 data-k="outTitle">④ 导出分发</h2>
    <span class="spacer" style="flex:1"></span>
    <span class="sub" id="outSelInfo"></span>
  </div>
  <div class="bd">
    <div class="check">
      <label><input type="checkbox" id="fmtEpub" checked> EPUB（带目录 · 推荐电纸书）</label>
      <label><input type="checkbox" id="fmtTxt"> 合并 TXT</label>
      <label><input type="checkbox" id="fmtSplit"> 分章 TXT（每章一个文件）</label>
    </div>
    <div class="check" style="margin-top:-2px">
      <span class="hint" data-k="outTheme"></span>
      <select id="selTheme" class="select" style="width:132px"></select>
      <span class="hint" data-k="outCover" style="margin-left:14px"></span>
      <select id="selCover" class="select" style="width:196px"></select>
    </div>
    <div class="check" style="margin-top:-2px">
      <span class="hint" data-k="savAs"></span>
      <label class="lab" id="savSufWrap"><span data-k="savSuf"></span>
        <input type="text" id="savSuffix" class="select" value="_清洗" maxlength="16" style="width:96px"></label>
      <label><input type="checkbox" id="optInplace"> <span data-k="optInplace"></span></label>
      <span class="hint" id="savHint"></span>
    </div>
    <div class="btnrow">
      <button class="btn b2" id="btnRun" data-k="btnRun">▶ 开始处理所选书籍</button>
      <span class="btn ghost" id="btnSaveDir" data-k="btnSaveDir">保存到所选文件夹…</span>
      <label class="lab" style="margin-left:6px"><input type="checkbox" id="optSkipDup"> <span data-k="optSkipDup"></span></label>
    </div>
    <div class="msg hidden" id="outMsg"></div>
    <div class="prog" id="progBar"><div></div></div>
    <div class="tblwrap" style="margin-top:10px;max-height:300px"><table class="tbl" id="outTbl"></table></div>
  </div>
</section>

<div class="logbar">
  <div class="lt" id="logToggle"><span id="logArrow">▾</span> <span data-k="logTitle">处理日志</span></div>
  <pre id="logBox"></pre>
</div>

<div class="stat" id="busuanzi_container_page_pv">
  <span data-k="stat_pv">👁 本页访问</span> <b id="busuanzi_value_page_pv"></b>
  <span data-k="stat_unit">次</span>
  <span id="busuanzi_container_site_uv"><span data-k="stat_uv">· 访客</span> <b id="busuanzi_value_site_uv"></b> <span data-k="stat_ppl">人</span></span>
</div>

</div>

<!-- 关于 / 帮助 对话框容器 -->
<div id="modalRoot"></div>

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script id="core-js">
/* ================= 双语词典 ================= */
const Z = {
  nav1:"书库", nav2:"清洗", nav3:"分章", nav4:"导出",
  libTitle:"① 书库", libSub:"把野生 TXT 变成书的第一步：扫进列表",
  btnPickDir:"📁 选择文件夹（全功能）", btnPickFiles:"📂 选择 TXT 文件…",
  dzTitle:"把 TXT 文件或文件夹拖到这里", dzSub:"支持整目录拖入 · 可多选 · 批量入库",

  logRulesLoaded:"已载入规则包「{n}」：内置 {b} 条、自定义 {c} 条",
  logRulesBad:"；跳过 {n} 条无效规则",

  logRulesEdit:"自定义规则已更新：{n} 条",

E.aboutBody = '<p><b>卷帙 DeShelf · v1.5.8</b></p>'
 +'<p>A local TXT organizing tool: <b>scan · clean · split · export EPUB / TXT</b>.</p>'
 +'<p>Twelve cleaning rules: URLs, site promos, pagination leftovers, corrupted lines, <b>punctuation alone on a line</b> (a line holding only a closing quote, full stop or comma is pulled back; ellipsis/dash-only lines are never touched; off by default), <b>join mid-sentence line breaks</b> (for files hard-wrapped at phone width — blank lines are treated as paragraph breaks; off by default), blanks, trailing spaces, full/half width, indentation, and <b>duplicate simplified/traditional lines</b> &mdash; when the same passage appears in both scripts, the traditional copy is dropped (works whether the copies alternate or a whole chapter is duplicated; all-traditional books are left untouched). The script table comes from <b>OpenCC</b> (Apache-2.0, used for comparison only, never to rewrite text).</p>'

/* SHA-256 + CRC32 已移入 Core（保持 Core 段零外部依赖，可被 node 冒烟测试独立抽取）。 */

/*CORE_BEGIN*/
const Core = (() => {
  /* SHA-256（零依赖，同步） */
  function sha256hex(buf){
    const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,

      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    const data = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const l = data.length, bitLen = l*8;
    const padLen = (((l+1+8+63)>>6)<<6);
    const m = new Uint8Array(padLen); m.set(data); m[l]=0x80;
    const dv = new DataView(m.buffer);
    dv.setUint32(padLen-8, Math.floor(bitLen/0x100000000), false);
    dv.setUint32(padLen-4, bitLen>>>0, false);
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,
        h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    const w=new Uint32Array(64);
    for(let i=0;i<padLen;i+=64){
      for(let t=0;t<16;t++) w[t]=dv.getUint32(i+t*4,false);
      for(let t=16;t<64;t++){const s0=((w[t-15]>>>7)|(w[t-15]<<25))^((w[t-15]>>>18)|(w[t-15]<<14))^(w[t-15]>>>3);
        const s1=((w[t-2]>>>17)|(w[t-2]<<15))^((w[t-2]>>>19)|(w[t-2]<<13))^(w[t-2]>>>10);
        w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;}
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for(let t=0;t<64;t++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
        const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[t]+w[t])>>>0;
        const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
        const maj=(a&b)^(a&c)^(b&c);const t2=(S0+maj)>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
      h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;
      h4=(h4+e)>>>0;h5=(h5+f)>>>0;h6=(h6+g)>>>0;h7=(h7+h)>>>0;}
    const H=[h0,h1,h2,h3,h4,h5,h6,h7];
    let out="";for(let i=0;i<8;i++) out+=H[i].toString(16).padStart(8,"0");
    return out;
  }
  /* CRC32 */
  const _CRC=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);_CRC[i]=c>>>0;}
  function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_CRC[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}

  /* ---------- 编码识别（对齐 python detect_bytes） ---------- */
  function detectEnc(bytes){
    const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) return "utf-8-sig";
    if(b[0]===0xFF&&b[1]===0xFE) return "utf-16-le";
    if(b[0]===0xFE&&b[1]===0xFF) return "utf-16-be";
    const probe=b.subarray(0,2000);
    for(let i=0;i<probe.length;i++) if(probe[i]===0) return "utf-16-le";
    try{ new TextDecoder("utf-8",{fatal:true}).decode(b); return "utf-8"; }
    catch(_){ return "gbk"; }
  }
  function decodeBytes(bytes,enc){
    let b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    if(enc==="utf-8-sig" && b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF) b=b.subarray(3);
    try{
      if(enc==="utf-16-le") return new TextDecoder("utf-16le").decode(b);
      if(enc==="utf-16-be") return new TextDecoder("utf-16be").decode(b);
      if(enc==="gbk") return new TextDecoder("gbk").decode(b);
      return new TextDecoder("utf-8").decode(b);
    }catch(_){ return new TextDecoder("utf-8").decode(b); }
  }
  function countChars(text){
    return text.replace(/[\n\r\t \u3000\u00a0]/g,"").length;
  }
  function humanSize(n){
    const u=["B","KB","MB","GB"];let i=0;
    while(n>=1024&&i<3){n/=1024;i++;}
    return i===0?Math.round(n)+" B":(n.toFixed(1))+" "+u[i];
  }

  /* ---------- 元信息推断（对齐 guess_meta） ---------- */
  /* 正文里的字段标识：可以在行首，也可以跟在同一行前一个字段后面（用空白或分隔符隔开），
     但前面必须是空白/分隔符，免得把「这本书的作者：某某」这类叙述句当成元信息 */
  const RE_BRACKET=/《(.+?)》/;
  const AUTHOR_KEYS=["作者","著者","编者","编著","著"];
  const LABEL_HEAD="(?:^|[\\s\\u3000,，;；、|｜\\/／])";
  const TITLE_LABELS="(?:书名|标题|题\\s*目|小说名)";
  const AUTHOR_LABELS="(?:作者|作\\s*者)";
  const FIELD_LABELS="(?:"+TITLE_LABELS+"|"+AUTHOR_LABELS+")";
  const RE_TITLE=new RegExp(LABEL_HEAD+TITLE_LABELS+"\\s*[:：]\\s*");
  const RE_AUTHOR=new RegExp(LABEL_HEAD+AUTHOR_LABELS+"\\s*[:：]\\s*");
  /* 同一行挤着多个字段时，值到此为止 */
  const FIELD_END=new RegExp("\\s*"+FIELD_LABELS+"\\s*[:：]");
  /* 零宽/BOM/方向控制符，常混在下载来的文件名里 */
  const INVIS_RE=/[\uFEFF\u200B-\u200F\u2028\u2029\u2060]/g;
  /* 版本/来源类标签，出现在方括号或标识后面时不是作者 */
  const META_TAGS=new Set(["全本","全集","全书","完本","完结","完结本","连载","精校","精校版", "校对","校对版","修订版","珍藏版","收藏版","无删减","未删节","手打","手打版", "全文","全文字","txt","text","下载","免费","最新章节"]);
  /* 占位词：出现了也不算识别出作者 */
  const AUTHOR_BAD=new Set(["未知","佚名","无名","不详","暂无","无","作者","n/a","na", "unknown","null","none"]);

  function authorRe(keys){
    /* 标识后必须跟冒号或空白（否则「著作权法」会被误判）；
       名字里碰到下一个「作者：」就停，免得「作者：甲作者：乙」拼成「甲作者」 */
    const body=(keys&&keys.length?keys:AUTHOR_KEYS).slice()
      .sort((a,b)=>b.length-a.length)
      .map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
    return new RegExp("(?:"+body+")\\s*(?:[:：]\\s*|\\s+)"
      +"((?:(?!(?:"+body+")\\s*[:：])[^\\s\\[\\]【】()（）《》_\\-—－:：,，。;；、])+)");
  }
  /* 把字段值截到下一个「书名：」「作者：」等标识之前，并去掉残留分隔符 */
  function cutField(s){
    const m=(s||"").match(FIELD_END);
    if(m) s=s.slice(0,m.index);
    return s.replace(/^[\s\u3000,，;；|｜\/／、]+|[\s\u3000,，;；|｜\/／、]+$/g,"");
  }
  function fieldValue(line,re){
    const m=line.match(re);
    return m ? cutField(line.slice(m.index+m[0].length)) : "";
  }
  /* 清洗作者串，去掉扩展名残留、书名号、多余空格与不可见字符 */
  function cleanAuthor(s){
    s=(s||"").replace(INVIS_RE,"").trim().replace(/(?:\.(?:txt|text))+$/i,"");
    s=s.replace(/^[\s\u3000\-—－_·.,，。;；:：、<>《》|｜\/／"'“”‘’]+|[\s\u3000\-—－_·.,，。;；:：、<>《》|｜\/／"'“”‘’]+$/g,"");
    s=s.replace(/\s+/g," ").trim();
    if(!s||s.length>20||/^[0-9０-９]+$/.test(s)) return "";
    if(AUTHOR_BAD.has(s.toLowerCase())||META_TAGS.has(s)) return "";
    return s;
  }
  function cleanName(name){
    name=name.replace(/[（(][^（）()]*?[）)]|\[[^\]]*\]|\.txt$/gi,"");
    name=name.replace(/[_\-—－]+/g," ");
    return name.replace(/\s+/g," ").trim();
  }
  function guessMeta(name,text,authorKeys){
    let title="",author="";
    /* 1) 正文优先：前 25 行里的「书名：」「作者：」，同一行有多个字段也能分别取到 */
    const head=(text||"").split(/\r\n|\r|\n/).slice(0,25);
    for(const line of head){
      if(!title){const v=fieldValue(line,RE_TITLE); if(v) title=v;}
      if(!author){const a=cleanAuthor(fieldValue(line,RE_AUTHOR)); if(a) author=a;}
    }
    /* 2) 文件名：去掉 BOM/隐藏字符与所有 .txt 尾巴，只留主名 */
    let base=String(name||"").replace(INVIS_RE,"").replace(/^.*[\\\/]/,"");
    base=base.replace(/(?:\.(?:txt|text))+$/i,"");
    const mb=base.match(RE_BRACKET);
    if(mb&&!title){const t=mb[1].trim(); if(t) title=t;}
    /* 3) 文件名：方括号里的名字（[作者]书名 / 书名[作者]），圆括号多是版本信息不算 */
    let rest=base.replace(/《.+?》/g,"");
    const RE_BA=/[\[【]([^\[\]【】]{1,20})[\]】]/g;
    let m=RE_BA.exec(rest);
    while(m){
      const cand=cleanAuthor(m[1]);
      if(cand){ if(!author) author=cand; rest=rest.split(m[0]).join(" "); break; }
      m=RE_BA.exec(rest);
    }
    /* 4) 文件名：「作者：xxx」等标识，只认第一个；正文已有作者时也照样剔出书名 */
    const m4=rest.match(authorRe(authorKeys));
    if(m4){
      if(!author){const cand=cleanAuthor(m4[1]); if(cand) author=cand;}
      rest=rest.split(m4[0]).join(" ");
    }
    rest=cleanName(rest);
    if(rest){
      const parts=rest.split(" ").filter(Boolean);
      if(!title&&parts.length) title=parts[0];
      if(!author&&parts.length>=2){
        const cand=cleanAuthor(parts[parts.length-1]);
        if(cand&&cand.length>1&&cand.length<=12) author=cand;
      }
    }
    if(!title) title=cleanName(base)||base;
    return {title:title.trim(),author:author.trim()};
  }

     tip:"给每个非空段落开头补两个全角空格",tip_en:"Prepend two full-width spaces to each non-empty paragraph"},
    {id:"jsdup",name:"简繁重复行（保留简体）",name_en:"Duplicate simplified/traditional lines",
     tip:"同一段正文同时有简体和繁体两份时，删掉繁体那份；相邻成对、整章重复都能认。全繁体的书不受影响，默认关闭",
     tip_en:"When a paragraph exists in both simplified and traditional, drop the traditional copy. Handles alternating lines and whole duplicated chapters; books written only in traditional are left alone. Off by default"},
  ];
  const DEFAULT_ON=["url","site","nav","moji","blank2","trim","half"];

  const URL_RE=/(https?:\/\/|www\.|ftp:\/\/|[a-z0-9\-]+\.(com|net|org|cn|cc|me|la|tv|info|xyz)\b)/i;
  /* 强特征宣传词：正文里几乎不会出现，命中即可疑 */
  const SITE_RE=/(记住本站|收藏本站|本站地址|书籍地址|笔趣|顶点小说|手机阅读|wap\.|txt下载|TXT下载|小说下载网|免费小说网|最新网址|首发网址|天才一秒|无弹窗|更新最快|手打版|本章免费)/i;
  /* 备注：请记住/请收藏/请到/转载请/手机版/百度搜索 这些在正常对话里也会出现
     （“把客人请到屋里”“你百度搜索一下”），故不再作为单独判定广告的依据 */
  const NAV_RE=/^\s*(上一页|下一页|上一章|下一章|返回目录|返回书城|加入书架|加入书签|推荐票|月票|投推荐|打赏|本章未完|未完待续|<--|-->|=====|-----)/;
  const MOJI_RE=/[\ufffd\ue000-\uf8ff]|[\x00-\x08\x0b\x0c\x0e-\x1f]/;

  /* 判定“这行是不是广告”用的尺子 */
  const AD_TAIL_MAX=64, AD_MIN_BODY=6, AD_SHORT=32, AD_TINY=24, AD_AFTER=10;
  const AD_HEAD_RE=/(记住|收藏|网址|本站|书站|手机阅读|手机版|最新章|一秒|更新最快|推荐票|月票|笔趣阁|顶点|全文阅读|小说网|手打)/;
  const SLIM_RE=/[\s\u3000，,。.！!？?、；;：:…\-—－_“”‘’"'（）()《》〈〉【】\[\]·~@#%&*+=|/\\<>^_]/g;
  function slim(s){return s.replace(SLIM_RE,"").length;}
  /* 判定一行里的广告：keep 不动 / cut 只裁行尾 / drop 整行丢弃 */
  function adSplit(s,useUrl,useSite){
    const mu=useUrl?URL_RE.exec(s):null, ms=useSite?SITE_RE.exec(s):null;
    if(!mu&&!ms)return["keep",0];
    const siteFirst=!!ms&&(!mu||ms.index<=mu.index);
    const start=siteFirst?ms.index:mu.index, end=siteFirst?(ms.index+ms[0].length):(mu.index+mu[0].length);
    const head=s.slice(0,start);
    const body=slim(head), total=slim(s);
    if(siteFirst){
      if(total<AD_SHORT)return["drop",0];
      if(body>=AD_MIN_BODY&&s.length-start<=AD_TAIL_MAX)return["cut",start];
      return["keep",0];
    }
    if(AD_HEAD_RE.test(head)&&total<AD_SHORT)return["drop",0];
    if(body<AD_MIN_BODY){
      if(body===0&&(total<AD_TINY||AD_HEAD_RE.test(head+s.slice(end))))return["drop",0];
      /* 网址前面只有几个字（“欢迎访问”），后面又接着推广语 → 整行仍是广告 */
      const tail=s.slice(end);
      if(AD_HEAD_RE.test(tail)&&slim(tail)<=AD_TAIL_MAX)return["drop",0];
      return["keep",0];
    }
    if(slim(s.slice(end))<=AD_AFTER&&s.length-start<=AD_TAIL_MAX)return["cut",start];
    return["keep",0];
  }

  /* ---------- 段落修复：标点独占一行 / 句中断行 ----------
     盗版站按手机屏宽硬断，一段话被切成十几行，收尾引号还会被挤成单独一行。
     以空行作段落界（不能靠“行尾有没有标点”判断 —— 硬断点经常正好落在句号后）。 */
  const HEAD_BAN=new Set("，。、；：？！”’》」』）】,.;:?!");
  const QUOTE_END=new Set("”’\"'");
  const BRACKET_END=new Set("」』）】》〉");
  const OPEN_ANY=new Set("「『（(【《〈“‘");
  const SENT_END=new Set("。！？…”』」）】.!?~—…：:");
  const ONLY_MAX=3;
  const ONLY_PUNCT=/^[\s\u3000，。、；：？！…”’"'「」『』（）()【】《》〈〉·—～]+$/;
  /* 省略号/破折号独占一行是作家故意的排版，不能当坏行；纯逗号句号才是坏行 */
  const SOFT_ONLY=new Set("…·—～－–-—.");
  const HARD_ONLY=new Set("，。、；：？！,.;:?!");
  const SEP_LINE=/^\s*[=\-*_~·—─━※◇◆■□+]{3,}\s*$/;
  const HEAD_LINE=/^\s*(第\s*[0-9０-９零〇一二三四五六七八九十百千万两]{1,15}\s*[章节節回卷篇集部]|序章|序言|楔子|引子|尾声|尾聲|后记|後記|番外|终章|終章|正文|目录|目錄)/;
  const UNWRAP_MAX=3000;
  function isBlockLine(s){
    if(!s) return true;
    if(SEP_LINE.test(s)) return true;
    const t=s.replace(/^[　\s]+|[　\s]+$/g,"");
    return t.length<=50&&HEAD_LINE.test(t);
  }
  function joinPair(prev,nxt){
    return prev.replace(/[　\s]+$/,"")+nxt.replace(/^[　\s]+|[　\s]+$/g,"");
  }
  function onlyKind(s){
    for(const ch of s) if(OPEN_ANY.has(ch)) return null;   // 「……」这种是段落写法
    for(const ch of s) if(QUOTE_END.has(ch)||BRACKET_END.has(ch)) return "close";
    const core=Array.from(s).filter(c=>!/\s/.test(c));
    if(core.length&&core.every(c=>HARD_ONLY.has(c))) return "hard";
    if(core.length&&core.every(c=>SOFT_ONLY.has(c))) return "soft";
    return null;
  }
  function fixLineHeads(lines){
    const out=[];let n=0;
    for(const raw of lines){
      const s=raw.trim();
      if(!s||isBlockLine(s)){out.push(raw);continue;}
      const prev=out.length?out[out.length-1]:"";
      if(prev&&!isBlockLine(prev.trim())){
        if(s.length<=ONLY_MAX&&ONLY_PUNCT.test(s)){
          const kind=onlyKind(s);
          if(kind!=="close"&&kind!=="hard"){out.push(raw);continue;}
          const last=s[s.length-1];
          if(!(QUOTE_END.has(last)&&prev.replace(/[　\s]+$/,"").endsWith(last))){
            out[out.length-1]=prev.replace(/[　\s]+$/,"")+s;n++;continue;
          }
        }else if(HEAD_BAN.has(s[0])){
          out[out.length-1]=prev.replace(/[　\s]+$/,"")+s;n++;continue;
        }
      }
      out.push(raw);
    }
    return [out,n];
  }
  function scanParaIssues(lines){
    /* 规则关着的时候也要让用户知道“文件里有这类毛病”，只数不改 */
    let lone=0,prev="";
    for(const raw of lines){
      const s=raw.trim();
      if(!s){prev="";continue;}
      const kind=(s.length<=ONLY_MAX&&ONLY_PUNCT.test(s))?onlyKind(s):null;
      if((kind==="close"||kind==="hard")&&prev&&!isBlockLine(prev)) lone++;
      prev=s;
    }
    let blocks=0,bucket=[];
    const flush=()=>{
      if(bucket.length>=4){
        let total=0,noEnd=0;
        for(const x of bucket){
          total+=x.length;
          if(!SENT_END.has(x[x.length-1])) noEnd++;
        }
        if(total>=120&&noEnd*10>=bucket.length*6) blocks++;
      }
      bucket=[];
    };
    for(const raw of lines.concat([""])){
      const s=raw.trim();
      if(!s||isBlockLine(s)){flush();continue;}
      bucket.push(s);
    }
    flush();
    return {lone,blocks};
  }
  function unwrapParagraphs(lines,maxLen){
    maxLen=maxLen||UNWRAP_MAX;
    const out=[];let merged=0,skipped=0,block=[];
    const flush=()=>{
      if(!block.length) return;
      if(block.length>1){
        let total=0;
        for(const x of block) total+=x.replace(/^[　\s]+|[　\s]+$/g,"").length;
        if(total>maxLen){skipped++;out.push(...block);block=[];return;}
        let acc=block[0];
        for(let i=1;i<block.length;i++){acc=joinPair(acc,block[i]);merged++;}
        out.push(acc);
      }else out.push(...block);
      block=[];
    };
    for(const raw of lines){
      const s=raw.trim();
      if(!s){flush();out.push(raw);}
      else if(isBlockLine(s)){flush();out.push(raw);}
      else block.push(raw);
    }
    flush();
    return [out,merged,skipped];
  }

  /* 只转全角数字(FF10-FF19)与全角字母(FF21-FF3A / FF41-FF5A)，中文标点一律不动 */
  function toHalfwidth(s){
    let out="";
    for(const ch of s){
      const c=ch.codePointAt(0);
      if(c===0x3000) out+=" ";
      else if((c>=0xFF10&&c<=0xFF19)||(c>=0xFF21&&c<=0xFF3A)||(c>=0xFF41&&c<=0xFF5A))
        out+=String.fromCodePoint(c-0xFEE0);
      else out+=ch;
    }
    return out;
  }

  const DD_BLK_LEN=6, DD_BLK_SIM=0.6, DD_BLK_RUN=8, DD_BLK_VOTE=4, DD_BLK_TOP=8, DD_BLK_EXT=30;
  /* 归一化字符串的二元组集合 */
  /* 版本标记行：`##########  繁體版  ##########`，整行只有装饰符号 + 版本字样 */
  const VER_MARK=new Set(["繁体版","繁體版","简体版","簡體版","繁体","繁體",
                          "简体","簡體","正体版","正體版","正体","正體"]);
  const VER_DECO=/[#=*\-_—─━~～·※◇◆■□¤°+|｜|\s]/g;
  function _isVerMark(s){return s.length<=60&&VER_MARK.has(s.replace(VER_DECO,""));}

  function _bi(k){
    const s=new Set();
    if(k.length<2){if(k)s.add(k);return s;}
    for(let i=0;i+1<k.length;i++)s.add(k.slice(i,i+2));
    return s;
  }
  /* bigram 包含率（不是 Jaccard）：一边多插几个乱码字，交集几乎不变 */
  function _over(a,b){
    if(!a||!b||!a.size||!b.size)return 0;
    let n=0;
    const [x,y]=a.size<=b.size?[a,b]:[b,a];
    for(const g of x)if(y.has(g))n++;
    return n/Math.min(a.size,b.size);
  }
  /* 同一段正文有简繁两份时删繁体那份。
     ① 归一后文本相同、繁体字更多 → 删；
     ② 一边被插了乱码/网址，归一后对不上，按 bigram 包含率认成同一句 → 删；
     ③ 整块「简体一份 + 繁体一份」，连两岸用词差异（螢幕/屏幕）都算差异，
        于是按偏移找出成对整块，整块删繁体那份。 */
  function dedupeScriptDup(lines){
    const n=lines.length,keys=new Array(n).fill(""),sc=new Array(n).fill(0);
    const gone=new Set();
    for(let i=0;i<n;i++)if(lines[i]&&_isVerMark(lines[i]))gone.add(i);  /* 版本标记行：先去 */
    for(let i=0;i<n;i++){
      const s=lines[i];
      if(!s||gone.has(i))continue;
      const k=_normKey(s);
      keys[i]=k;
      if(k)sc[i]=_tradScore(s);
    }
    /* ① 比最简那份更繁的行 */
    const low=new Map();
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(!k)continue;
      const b=low.get(k);
      if(b===undefined||sc[i]<b)low.set(k,sc[i]);
    }
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k&&low.get(k)<sc[i])gone.add(i);
    }
    const gs=new Array(n).fill(null);
    for(let i=0;i<n;i++)if(keys[i].length>=DD_BLK_LEN)gs[i]=_bi(keys[i]);
    /* ② 模糊：抗插入噪声 */
    const idx=new Map();
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k.length<DD_MINLEN)continue;
      for(const p of [k.slice(0,DD_ANCHOR),k.slice(-DD_ANCHOR)]){
        const a=idx.get(p);
        if(a)a.push(i);else idx.set(p,[i]);
      }
    }
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k.length<DD_MINLEN||sc[i]<=0)continue;
      let best=0,bj=-1;
      const cand=(idx.get(k.slice(0,DD_ANCHOR))||[]).concat(idx.get(k.slice(-DD_ANCHOR))||[]);
      for(const j of cand){
        if(j===i||gone.has(j)||sc[j]>=sc[i])continue;
        const a=k.length,b=keys[j].length;
        if(Math.max(a,b)>Math.min(a,b)*DD_RATIO+2){
          /* 乱码整段追加/前置：短的那行仍是长那行的完整前缀或后缀 */
          const sh=a<=b?k:keys[j],lg=a<=b?keys[j]:k;
          if(!(lg.startsWith(sh)||lg.endsWith(sh)))continue;
        }
        const c=_over(gs[i],gs[j]);
        if(c>best||(c===best&&(bj<0||j<bj))){best=c;bj=j;}
      }
      if(best>=DD_FUZZY)gone.add(i);
    }
    /* ③ 块对齐：偏移投票 */
    const pos=new Map();
    for(let i=0;i<n;i++){
      const k=keys[i];
      if(k.length<4)continue;
      const p=k.slice(0,DD_ANCHOR);
      const a=pos.get(p);
      if(a)a.push(i);else pos.set(p,[i]);
    }
    const votes=new Map();
    for(const ps of pos.values()){
      const m=ps.length;
      if(m<2||m>8)continue;
      for(let a=0;a<m;a++)for(let b=a+1;b<m;b++){
        const d=ps[b]-ps[a];
        votes.set(d,(votes.get(d)||0)+1);
      }
    }
    const order=[...votes.entries()].sort((x,y)=>y[1]-x[1]||x[0]-y[0]).slice(0,DD_BLK_TOP);
    const near=(t,d)=>{
      if(t<0||t+d>=n)return false;
      const ka=keys[t],kb=keys[t+d];
      if(!ka||!kb)return false;
      if(ka===kb)return true;
      if(ka.length<DD_BLK_LEN||kb.length<DD_BLK_LEN)return false;
      if(Math.max(ka.length,kb.length)>Math.min(ka.length,kb.length)*DD_RATIO+2)return false;
      return _over(gs[t],gs[t+d])>=DD_BLK_SIM;
    };
    for(const [d,sup] of order){
      if(sup<DD_BLK_VOTE)break;
      const limit=n-d;
      let t=0;
      while(t<limit){
        if(!near(t,d)){t++;continue;}
        let s0=t,e0=t;
        while(e0+1<limit&&near(e0+1,d))e0++;
        if(e0-s0+1>=DD_BLK_RUN){
          let same=true;
          for(let k=s0;k<=e0;k++)if(lines[k]!==lines[k+d]){same=false;break;}
          if(!same){                 /* 两块字面完全一样 = 原文自身重复，不碰 */
            let lo=s0,hi=e0,c=0;
            while(lo>0&&c<DD_BLK_EXT&&near(lo-1,d)){lo--;c++;}
            c=0;
            while(hi+1<limit&&c<DD_BLK_EXT&&near(hi+1,d)){hi++;c++;}
            let ca=0,cb=0;
            for(let k=lo;k<=hi;k++){
              if(sc[k]>sc[k+d])ca++;
              else if(sc[k+d]>sc[k])cb++;
            }
            const drop=ca>=cb?0:d;    /* 副本在哪一侧（繁简打分拉平时用） */
            for(let k=lo;k<=hi;k++){
              if(sc[k]>sc[k+d])gone.add(k);
              else if(sc[k+d]>sc[k])gone.add(k+d);
              else if(lines[k]===lines[k+d]&&lines[k])gone.add(k+drop);  /* 字面一样：只留一份 */
            }
            t=hi+1;
            continue;
          }
        }
        t=e0+1;
      }
    }
    const kept=[],dels=[];
    for(let i=0;i<n;i++){
      if(gone.has(i)){dels.push(lines[i]);continue;}
      kept.push(lines[i]);
    }
    return {kept,dels};
  }

  function cleanText(text,enabled,wantDel,custom){
    /* 自定义规则先编译：drop 整行丢弃，cut 只挖掉命中的片段（与桌面版同序） */
    const cust=[];
    for(const r of (custom||[])){
      if(!r||r.enabled===false)continue;
      const pat=String(r.pattern||"").trim();
      if(!pat)continue;
      const fl=String(r.flags||"").replace(/[^im]/g,"");
      try{cust.push([new RegExp(pat,fl),r.action==="cut"?"cut":"drop"]);}catch(e){}
    }
    const on=new Set(enabled||[]);let removed=0,trimmed=0;let out=[];const del=new Set();const cut=new Map();
    let glued=0,merged=0,wrapSkip=0;
    /* 段落修复放在逐行规则之前：合并后网址/导航行才判得准 */
    if(on.has("punct")||on.has("unwrap")){
      let ls=text.split(/\r\n|\r|\n/);
      if(on.has("punct")){const a=fixLineHeads(ls);ls=a[0];glued=a[1];}
      if(on.has("unwrap")){const a=unwrapParagraphs(ls);ls=a[0];merged=a[1];wrapSkip=a[2];}
      text=ls.join("\n");
    }
    let prevBlank=false;
    const useUrl=on.has("url"),useSite=on.has("site");
    for(const raw of text.split(/\r\n|\r|\n/)){
      let s=raw,lead=0;
      if(on.has("trim")){lead=raw.length-raw.replace(/^\s+/,"").length;s=s.trim();}
      if(on.has("half")) s=toHalfwidth(s);
      let d=0,drop=false;
      if(useUrl||useSite){
        const r=adSplit(s,useUrl,useSite);
        if(r[0]==="drop") drop=true;
        else if(r[0]==="cut") d=r[1];
      }
      if(!drop&&!d){
        if(on.has("nav")&&NAV_RE.test(s)) drop=true;
        else if(on.has("moji")&&MOJI_RE.test(s)) drop=true;
      }
      if(drop){removed++;if(wantDel)del.add(raw);continue;}
      if(d){
        s=s.slice(0,d).replace(/[ \u3000，,、；;：:]+$/,"");
        if(!slim(s)){removed++;if(wantDel)del.add(raw);continue;}
        trimmed++;
        if(wantDel)cut.set(raw,d+lead);
      }
      if(cust.length&&!drop){
        for(const item of cust){
          const m=item[0].exec(s);
          if(!m)continue;
          if(item[1]==="cut") s=s.slice(0,m.index)+s.slice(m.index+m[0].length);
          else drop=true;
          break;
        }
        if(drop){removed++;if(wantDel)del.add(raw);continue;}
      }
      if(on.has("blank")&&!s){removed++;if(wantDel)del.add(raw);continue;}
      if(on.has("blank2")&&!s){
        if(prevBlank){removed++;if(wantDel)del.add(raw);continue;}
        prevBlank=true;out.push("");continue;}
      prevBlank=false;
      if(on.has("indent")&&s) s="　　"+s;
      out.push(s);
    }
    let jsdup=0;
    if(on.has("jsdup")&&out.length){
      const r=dedupeScriptDup(out);
      if(r.dels.length){
        jsdup=r.dels.length;removed+=jsdup;
        if(wantDel)for(const x of r.dels)del.add(x);
        out=r.kept;
      }
    }
    let a=0,b=out.length;
    while(a<b&&!out[a]) a++;
    while(b>a&&!out[b-1]) b--;
    out=out.slice(a,b);
    return {text:out.join("\n")+(out.length?"\n":""),removed,trimmed,del,cut,jsdup,merged,glued,wrapSkip};
  }

  /* ---------- 分章（对齐 split_chapters） ---------- */
  const CHAPTER_RE=[
    /^第\s*[0-9０-９零〇一二三四五六七八九十百千万两]{1,15}\s*[章节節回卷篇集部]\s*[^\n]{0,40}/,
    /(?:^|\s)(?:卷|Chapter|CHAPTER|chapter)\s*[0-9０-９零〇一二三四五六七八九十百千万]{1,15}[^\n]{0,40}/,
    /(?:序章|序言|楔子|引子|尾声|後记|后记|番外|终章|結局|结局|完本)[^\n]{0,40}/,
  ];
  const MAX_TITLE_LEN=50;
  /* 标题与正文挤在同一行时整行更长，单独放宽到 90 */
  const MAX_INLINE_LEN=90;
  /* 被拆出来当标题的那截最多这么长（再长就不像标题了） */
  const INLINE_MAX_HEAD=30;
  /* 冒号后至少这么长，才认作同行正文 */
  const INLINE_MIN_TAIL=12;
  /* 盗版站把换行转成了字面 \r\n 塞在行里，判据与标题都要先剥掉 */
  const LITERAL_ESC=/\\[rn]/g;
  /* 冒号后那一截是不是正文：够长就算；短的话以句末标点收尾就算 ——
     副标题（「一个意外的电话」）通常是个光秃秃的词组、不带句号。 */
  const isInlineBody=function(t){
    if(t.length>=INLINE_MIN_TAIL) return true;
    return t.length>=6 && /[。！？…”」]$/.test(t);
  };
  /* 开头这几行算元信息：只由它们组成的「开篇」不单独成章 */
  const META_LINE=/^(?:书名|标题|题\s*目|小说名|作\s*者|著\s*者|简介|内容简介|内容介绍)\s*[:：]/;
  const CH_HEAD=/^\s*第\s*([0-9〇零一二三四五六七八九十百千两]+)\s*([章节節回卷篇集部话話])/;
  /* 缓冲区为空时又命中新标题：判重后再定章名。
     旧写法 cur+" "+hit 遇到目录连排 / 标题连写两行，会拼成
     「第一章 起 第二章 承 第三章 转 第一章 起」（2026-11-27 小红书反馈）。
     同一大类同号码取更完整的；同大类不同号就用新的（目录残留丢掉）；
     跨大类（卷后跟章）或取不到号，仍旧拼接。 */
  function mergeEmptyTitle(cur,hit){
    const a=String(cur||"").replace(/\s+/g,""), b=String(hit||"").replace(/\s+/g,"");
    if(a&&b&&(a.indexOf(b)>=0||b.indexOf(a)>=0)) return b.length>a.length?hit:cur;
    const ma=String(cur||"").match(CH_HEAD), mb=String(hit||"").match(CH_HEAD);
    if(ma&&mb&&ma[2]===mb[2]){
      if(ma[1]===mb[1]) return hit.length>cur.length?hit:cur;
      return hit;
    }
    return String(cur||"")+" "+String(hit||"");
  }
  function splitChapters(text,custom){
    let pats;
    if(custom&&String(custom).trim()){
      let re;try{re=new RegExp(String(custom).trim());}catch(e){throw new Error("bad-regex");}
      pats=[re];
    }else pats=CHAPTER_RE;
    const chapters=[];let cur="开篇";const buf=[];
    for(const raw of text.split(/\r\n|\r|\n/)){
      const s=raw.trim().replace(LITERAL_ESC,"");
      let hit=null,rest="";
      if(s&&s.length<=MAX_TITLE_LEN&&!s.endsWith("。")){
        for(const p of pats){const m=s.match(p);if(m&&m.index===0){hit=s;break;}}
      }
      /* 标题与正文挤在同一行：`第2章 《华侨文阵》：她身处的是1965年的唐人街。`
         这类行以句号结尾，按上面那条会被当成正文，整章并进前一章。
         2026-11-17 小红书反馈「同一本书只缺第 2 章」就是这一行恰好跨过
         一个完整句子，而第 3、4 章断在逗号处所以没事。
         判据：冒号后有一截（≥8 字）以句末标点收尾 → 前半当标题、后半留给正文。 */
      if(hit===null&&s.length<=MAX_INLINE_LEN){
        const mm=s.match(/^(.{1,40}?)[：:]\s*(.+)$/);
        if(mm&&mm[1].trim().length<=INLINE_MAX_HEAD&&isInlineBody(mm[2])){
          const head=mm[1].trim();
          for(const p of pats){
            const m=head.match(p);
            if(m&&m.index===0){hit=head;rest=mm[2].trim();break;}
          }
        }
      }
      if(hit!==null){
        const body=buf.join("\n").trim();
        if(body){chapters.push({t:cur,b:body});cur=hit;}
        else cur=(cur==="开篇")?hit:mergeEmptyTitle(cur,hit);
        buf.length=0;
        /* 同行正文归到这一章，缩进照原文留 */
        if(rest){const lead=(raw.match(/^\s*/)||[""])[0];buf.push(lead+rest);}
      }else buf.push(raw);
    }
    const body=buf.join("\n").trim();
    if(body) chapters.push({t:cur,b:body});
    else if(chapters.length&&cur!=="开篇")
      chapters[chapters.length-1]={t:chapters[chapters.length-1].t,b:chapters[chapters.length-1].b+"\n"+cur};
    /* 「开篇」只装着书名/作者这类元信息时不留成章（epub metadata 已有） */
    if(chapters.length&&chapters[0].t==="开篇"){
      const keep=chapters[0].b.split(/\r\n|\r|\n/)
        .filter(x=>x.trim()&&!META_LINE.test(x.trim()));
      if(!keep.length) chapters.shift();
    }
    if(!chapters.length) chapters=[{t:"全文",b:text.trim()}];
    return chapters;
  }

  /* ---------- deflate / zip ---------- */
  async function deflateRawBytes(u8){
    const cs=new CompressionStream("deflate-raw");
    const stream=new Blob([u8]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  const TE=new TextEncoder();

      const raw=typeof e.data==="string"?TE.encode(e.data):e.data;
      let method=0,comp=raw;
      if(!e.stored){
        comp=await deflateRawBytes(raw);
        if(comp.length>=raw.length){comp=raw;method=0;}else method=8;
      }
      const crc=crc32(raw);
      const nb=TE.encode(e.name);
      const lh=new Uint8Array(30+nb.length+comp.length);const dv=new DataView(lh.buffer);
      dv.setUint32(0,0x04034b50,true);dv.setUint16(4,20,true);dv.setUint16(6,0x0800,true);
      dv.setUint16(8,method,true);dv.setUint16(10,0,true);dv.setUint16(12,DOS_DATE,true);
      dv.setUint32(14,crc,true);dv.setUint32(18,comp.length,true);dv.setUint32(22,raw.length,true);
      dv.setUint16(26,nb.length,true);dv.setUint16(28,0,true);
      lh.set(nb,30);lh.set(comp,30+nb.length);
      chunks.push(lh);off+=lh.length;
      const ch=new Uint8Array(46+nb.length);const cv=new DataView(ch.buffer);
      cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
      cv.setUint16(8,0x0800,true);cv.setUint16(10,method,true);cv.setUint16(12,0,true);
      cv.setUint16(14,DOS_DATE,true);cv.setUint32(16,crc,true);cv.setUint32(20,comp.length,true);
      cv.setUint32(24,raw.length,true);cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);
      cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint32(36,0,true);
      cv.setUint32(42,off-lh.length,true);
      ch.set(nb,46);cen.push(ch);
    }
    const cenSize=cen.reduce((n,c)=>n+c.length,0);
    const eo=new Uint8Array(22);const ev=new DataView(eo.buffer);
    ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
    ev.setUint16(8,cen.length,true);ev.setUint16(10,cen.length,true);
    ev.setUint32(12,cenSize,true);ev.setUint32(16,off,true);ev.setUint16(20,0,true);
    const total=new Uint8Array(off+cenSize+22);let p=0;
    for(const c of chunks){total.set(c,p);p+=c.length;}
    for(const c of cen){total.set(c,p);p+=c.length;}
    total.set(eo,p);
    return total;
  }

  const COVER_PAGE="<?xml version='1.0' encoding='utf-8'?>\n<!DOCTYPE html>\n"+

  async function makeCover(title,author,W,H){
    try{
      W=W||600;H=H||800;
      const cv=document.createElement("canvas");cv.width=W;cv.height=H;
      const g=cv.getContext("2d");
      const PAPER="#f6f1e4",INK="#2f2a24",GOLD="#c6b494",GRAY="#786e60",FAINT="#b0a28a";
      g.fillStyle=PAPER;g.fillRect(0,0,W,H);
      g.strokeStyle=GOLD;g.lineWidth=2;g.strokeRect(18,18,W-37,H-37);
      g.lineWidth=1;g.strokeRect(30,30,W-61,H-61);
      const text=(String(title||"").trim()||"未命名");
      const n=text.length;
      const availH=H-300,availW=W-260;
      let size=40,per=n,cols=1;
      /* 先求「一列放下」的最大字号：短书名单列最像书 */
      let one=false;
      for(let s=112;s>24;s-=2){
        if(n*s*1.15<=availH&&s*1.35<=availW){size=s;per=n;cols=1;one=true;break;}
      }
      if(!one){
        for(let s=112;s>24;s-=2){
          const p=Math.max(1,Math.floor(availH/(s*1.15)));
          const c=Math.ceil(n/p);
          if(c*(s*1.35)<=availW){size=s;per=p;cols=c;break;}
        }
      }
      const colW=size*1.35,total=cols*colW-(colW-size);
      const xRight=W/2+total/2-size/2;
      const first=Math.min(per,n),blockH=first*size*1.15,y0=(H-blockH)/2;
      g.fillStyle=INK;g.textAlign="center";g.textBaseline="top";
      g.font=size+'px "KaiTi","STKaiti","Kaiti SC","Songti SC","SimSun",serif';
      for(let ci=0;ci<cols;ci++){
        const chunk=text.slice(ci*per,(ci+1)*per);
        if(!chunk)continue;
        const cx=xRight-ci*colW;let y=y0;
        for(const ch of chunk){g.fillText(ch,cx,y);y+=size*1.15;}
      }
      const half=size*0.62;
      g.strokeStyle=GOLD;g.lineWidth=2;
      g.beginPath();g.moveTo(xRight-half,y0-size*0.55);g.lineTo(xRight+half,y0-size*0.55);g.stroke();
      g.beginPath();g.moveTo(xRight-half,y0+blockH+size*0.38);g.lineTo(xRight+half,y0+blockH+size*0.38);g.stroke();
      if(author){
        let fs=32;
        g.font=fs+'px "KaiTi","STKaiti","Kaiti SC","Songti SC",serif';
        while(fs>16&&g.measureText(author).width>W-150){
          fs-=2;g.font=fs+'px "KaiTi","STKaiti","Kaiti SC","Songti SC",serif';
        }
        g.fillStyle=GRAY;
        g.fillText(author,W/2,H-128+(32-fs));
      }
      g.fillStyle=FAINT;
      g.font='22px "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif';
      g.fillText("卷帙 · DeShelf",W/2,H-66);
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.9));
      if(!blob) return null;
      return {data:new Uint8Array(await blob.arrayBuffer()),name:"cover.jpg",mime:"image/jpeg",w:W,h:H};
    }catch(e){return null;}
  }
  /* 把用户目录里找到的同名图片统一转成 JPEG（阅读器对 webp/gif 支持参差） */
  async function prepareCoverFile(file,maxSide,quality){

      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const g=cv.getContext("2d");
      g.fillStyle="#ffffff";g.fillRect(0,0,w,h);      // 透明底转 JPEG 会发黑

      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",quality));
      if(!blob) return null;
      return {data:new Uint8Array(await blob.arrayBuffer()),name:"cover.jpg",mime:"image/jpeg",w:w,h:h};

        "<head>\n  <meta charset=\"utf-8\"/>\n  <title>"+xmlEsc(pg.t)+"</title>\n"+

  const RULES_PACK_FORMAT="deshelf-rules";
  function exportRulesPack(enabled,custom,name){

      builtin:RULES.map(r=>r.id).filter(i=>on.has(i)),

        .map(r=>({name:r.name||"",pattern:r.pattern||"",

  function parseRulesPack(data){
    if(!data||typeof data!=="object") throw new Error("规则包内容不是 JSON 对象");
    if(data.format!==RULES_PACK_FORMAT)
      throw new Error("不是卷帙规则包：缺少 format="+RULES_PACK_FORMAT);
    const known=new Set(RULES.map(r=>r.id));
    const ids=(data.builtin||[]).filter(i=>known.has(i));
    const cust=[];let bad=0;
    for(const r of (data.custom||[])){
      if(!r||typeof r!=="object"||!String(r.pattern||"").trim()){bad++;continue;}
      try{new RegExp(r.pattern);}catch(e){bad++;continue;}
      cust.push({name:String(r.name||"").slice(0,40),pattern:r.pattern,
        action:r.action==="cut"?"cut":"drop",
        flags:String(r.flags||"").replace(/[^im]/g,""),
        enabled:r.enabled!==false});
    }
    return {ids:ids,custom:cust,name:String(data.name||""),bad:bad};
  }
  function customToText(custom){
    const lines=["# 每行一条：动作||正则||说明（说明可空）",
                 "# drop = 整行删除，cut = 只删掉命中的片段；忽略大小写写成 drop i",
                 "# 行首加 # 表示这条暂时不用"];
    for(const r of (custom||[])){
      if(!r||typeof r!=="object")continue;
      let act=r.action==="cut"?"cut":"drop";
      const fl=String(r.flags||"").replace(/[^im]/g,"");
      if(fl) act+=" "+fl;
      if(r.enabled===false) act="#"+act;
      lines.push(act+"||"+(r.pattern||"")+"||"+(r.name||""));
    }
    return lines.join("\n")+"\n";
  }
  function textToCustom(text){
    const rules=[];let bad=0;
    for(let ln of String(text||"").split(/\r\n|\r|\n/)){
      let raw=ln.replace(/\s+$/,"");
      if(!raw.trim())continue;
      let enabled=true;
      if(/^\s*#/.test(raw)){
        const trial=raw.replace(/^\s*#\s*/,"");
        if(/^(drop|cut)(\s+[imsx]{1,3})?\|\|/i.test(trial)){enabled=false;raw=trial;}
        else continue;
      }
      raw=raw.trim();
      let head,pat,note="";
      if(raw.indexOf("||")>=0){
        const parts=raw.split("||");
        head=parts[0].trim();pat=parts[1]||"";note=(parts[2]||"").trim();
      }else{
        const m=raw.match(/^(drop|cut)\b\s*([\s\S]*)$/i);
        if(!m){bad++;continue;}
        head=m[1];pat=m[2];
      }
      const m2=head.match(/^(drop|cut)(?:\s+([imsx]{1,3}))?$/i);
      if(!m2||!String(pat).trim()){bad++;continue;}
      try{new RegExp(pat);}catch(e){bad++;continue;}
      rules.push({name:note.slice(0,40),pattern:pat,action:m2[1].toLowerCase(),

    }

/* ================= 读取 / 扫描 ================= */
async function readBookBytes(book){
  if(book._bytes) return book._bytes;
  if(book.handle){const f=await book.handle.getFile();book._bytes=new Uint8Array(await f.arrayBuffer());}
  else if(book.file){book._bytes=new Uint8Array(await book.file.arrayBuffer());}
  return book._bytes;
}
async function bookText(book){ // 懒读，缓存
  if(book._text!==undefined) return book._text;
  const bytes=await readBookBytes(book);
  book._text=Core.decodeBytes(bytes, book.enc);
  return book._text;
}
function bookSource(book){return book._clean!==undefined?book._clean:book._text;}

async function computeBook(ent,prev){
  // 先挂上句柄/文件对象，readBookBytes 依赖它
  const b={rel:ent.rel,name:ent.name,sel:true,chapters:-1,handle:ent.handle,file:ent.file};
  if(prev && (prev.name===ent.name)){
    // 先拿元数据再比对缓存
    const f = ent.handle ? await ent.handle.getFile() : ent.file;
    const size=f.size, mtime=Math.floor(f.lastModified/1000);
    if(prev.size===size && prev.mtime===mtime){
      b.enc=prev.enc;b.chars=prev.chars;b.sha=prev.sha;b.md5=prev.md5;
      b.title=prev.title;b.author=prev.author;b.size=size;b.mtime=mtime;b.fromCache=true;
      b.handle=ent.handle;b.file=ent.file;
      return b;
    }
    b.size=size;b.mtime=mtime;
  } else {
    const f = ent.handle ? await ent.handle.getFile() : ent.file;
    b.size=f.size;b.mtime=Math.floor(f.lastModified/1000);
  }
  const bytes=await readBookBytes(b);
  b.enc=Core.detectEnc(bytes);
  const text=Core.decodeBytes(bytes,b.enc);
  b._text=text;
  b.chars=Core.countChars(text);
  b.sha=Core.sha256hex(bytes); b.md5=b.sha.slice(0,32);
  const meta=Core.guessMeta(b.name, text);
  b.title=meta.title;b.author=meta.author;
  b.handle=ent.handle;b.file=ent.file;
  return b;
}

async function scanModeA(dirHandle,dirName,fresh){
  const files=[],imgs=[];
  for await (const ent of dirHandle.values()){
    if(ent.kind==="file"){
      if(/\.(txt|text)$/i.test(ent.name)) files.push({rel:ent.name,handle:ent,name:ent.name});
      else if(IMG_RE.test(ent.name)) imgs.push({rel:ent.name,handle:ent,name:ent.name,img:true});
    } else if(ent.kind==="directory"){
      await walkDirA(ent,ent.name+"/",files,imgs);
    }
  }
  files.sort((x,y)=>x.rel<y.rel?-1:1);
  let cache={books:[]};
  if(!fresh){
    try{const hf=await dirHandle.getFileHandle(".deshelf_index.json");
      const f=await hf.getFile();if(f.size<8*1024*1024)
        cache=JSON.parse(await f.text());}catch(e){cache={books:[]};}
  }
  const cmap=new Map((cache.books||[]).map(b=>[b.rel,b]));
  const books=[];let hits=0,misses=0;
  for(const ent of files){
    const prev=cmap.get(ent.rel);
    const b=await computeBook(ent,prev);
    if(b.fromCache){hits++;}else{misses++;}
    books.push(b);
  }
  const covN=attachCovers(books,imgs);
  if(covN) log("📕 找到 "+covN+" 张同名封面图（导出时会打包进 EPUB）");
  St.rootHandle=dirHandle;St.rootName=dirName;
  await idbSet("rootHandle",dirHandle);cfgSet("rootName",dirName);
  await writeIndexA(dirHandle,dirName,books);
  return {books,hits,misses,covers:covN};
}
async function walkDirA(dir,prefix,out,imgs){
  for await (const ent of dir.values()){
    if(ent.kind==="file"){
      if(/\.(txt|text)$/i.test(ent.name)) out.push({rel:prefix+ent.name,handle:ent,name:ent.name});
      else if(imgs&&IMG_RE.test(ent.name)) imgs.push({rel:prefix+ent.name,handle:ent,name:ent.name,img:true});
    } else if(ent.kind==="directory"){ await walkDirA(ent,prefix+ent.name+"/",out,imgs); }
  }
}
async function writeIndexA(dirHandle,dirName,books){
  try{
    const payload={root:dirName,scanned:Date.now()/1000,
      books:books.map(b=>({rel:b.rel,name:b.name,size:b.size,mtime:b.mtime,enc:b.enc,
        chars:b.chars,md5:b.md5,title:b.title,author:b.author,chapters:b.chapters,sel:true}))};
    const hf=await dirHandle.getFileHandle(".deshelf_index.json",{create:true});
    const w=await hf.createWritable();
    await w.write(JSON.stringify(payload));
    await w.close();
  }catch(e){ log("⚠ .deshelf_index.json 写入失败（只读授权？）："+e.message); }
}
async function scanModeB(entries){
  const imgs=entries.filter(e=>e.img);
  const books=[];
  for(const ent of entries){
    if(ent.img) continue;
    const b=await computeBook(ent,null);
    books.push(b);
  }
  books.sort((x,y)=>x.rel<y.rel?-1:1);
  const covN=attachCovers(books,imgs);
  if(covN) log("📕 找到 "+covN+" 张同名封面图（导出时会打包进 EPUB）");
  return {books,hits:0,misses:books.length,covers:covN};
}
function scanModeBFromFileList(fileList){
  const out=[];
  for(const f of fileList){
    const rel=f.webkitRelativePath||f.name;
    if(/\.(txt|text)$/i.test(f.name)) out.push({rel,file:f,name:f.name});
    else if(IMG_RE.test(f.name)) out.push({rel,file:f,name:f.name,img:true});
  }
  return out;
}
async function walkDropEntries(itemList){
  const out=[];const entries=[];
  for(const it of itemList){const e=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(e)entries.push(e);}
  if(!entries.length){ // 退化：纯文件
    const fs=[];for(const it of itemList){const f=it.getAsFile&&it.getAsFile();if(f)fs.push(f);}
    return fs.length?scanModeBFromFileList(fs):null;
  }
  for(const e of entries) await walkEntry(e,"",out);
  return out;
}
function walkEntry(entry,prefix,out){
  return new Promise(async (resolve,reject)=>{
    try{
      if(entry.isFile){
        if(/\.(txt|text)$/i.test(entry.name)){
          const file=await new Promise((res,rej)=>entry.file(res,rej));
          out.push({rel:prefix+entry.name,file:file,name:entry.name});
        } else if(IMG_RE.test(entry.name)){
          const file=await new Promise((res,rej)=>entry.file(res,rej));
          out.push({rel:prefix+entry.name,file:file,name:entry.name,img:true});
        }
        resolve();
      } else if(entry.isDirectory){
        const reader=entry.createReader();
        // 目录大时需循环读
        for(;;){
          const batch=await new Promise((res,rej)=>reader.readEntries(res,rej));
          if(!batch.length) break;
          for(const e of batch) await walkEntry(e,prefix+entry.name+"/",out);
        }
        resolve();
      } else resolve();
    }catch(e){resolve();}
  });
}

function exportCsv(){
  if(!St.books.length)return;
  const L=TX();
  const rows=[[L.thName,L.thAuth,L.selCsvName,L.selCsvDir,L.thChars,L.thSize,L.thEnc,L.thDup]];
  const dups=dupShaSet();
  for(const b of St.books){

  }
  const csv=rows.map(r=>r.map(c=>{c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\r\n");
  dlBytes("deshelf_booklist.csv",csv,"text/csv;charset=utf-8",true);

function dlBytes(name,data,mime,bom){
  const blob = typeof data==="string"
    ? new Blob([(bom?"\ufeff":"")+data],{type:mime||"text/plain;charset=utf-8"})
    : new Blob([data],{type:mime||"application/octet-stream"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function fileNameBase(book){
  const stem=Core.safeFileName(book.title||book.name.replace(/\.(txt|text)$/i,""),70,T("kNone"));
  const sufEl=$("savSuffix");
  const suf=Core.safeFileName((sufEl?sufEl.value:"").trim().replace(/^\.+/,""),12,"");
  return stem+suf;
}

/* ================= 书库：选目录 / 拖拽 ================= */
async function requestDir(){
  /* iOS Safari 全系、Firefox、移动端浏览器都没有 showDirectoryPicker，
     不加这行会在调用处抛 TypeError，被 catch 吞掉后表现得像「点了没反应」 */
  if(!canDir) return null;
  let dh=null;
  try{ dh=await window.showDirectoryPicker({mode:"readwrite",id:"deshelf-root"}); }
  catch(e){ try{ dh=await window.showDirectoryPicker({mode:"read",id:"deshelf-root"}); }
    catch(e2){ if(e2&&e2.name!=="AbortError") log("目录授权失败："+e2.message); return null; } }
  return dh;
}
async function pickDirFlow(fresh){
  if(St.busy) return;
  if(!canDir){ openFileDialog(); return; }
  let dh;
  if(St.rootHandle){
    // 已授权：直接请求权限
    try{
      const p=await St.rootHandle.queryPermission({mode:"readwrite"});
      if(p!=="granted"){
        const r=await St.rootHandle.requestPermission({mode:"readwrite"});
        if(r!=="granted"){ const p2=await St.rootHandle.queryPermission({mode:"read"});
          if(p2!=="granted") await St.rootHandle.requestPermission({mode:"read"}); }
      }
      dh=St.rootHandle;
    }catch(e){}
  }
  if(!dh) dh=await requestDir();
  if(!dh) return;
  St.mode="A";St.rootHandle=dh;St.rootName=dh.name;
  await idbSet("rootHandle",dh);cfgSet("rootName",dh.name);
  await runScanA(dh,dh.name,fresh);
}
async function runScanA(dh,name,fresh){
  St.busy=true;refreshLibInfo();
  log("开始扫描："+name+(fresh?"（重新扫描）":""));
  try{
    const res=await scanModeA(dh,name,fresh);
    setBooks(res.books,res.hits);
    log(name+" · "+res.books.length+" 本（缓存命中 "+res.hits+"，新读 "+res.misses+"）");
    goStep(1);
  }catch(e){
    log("扫描失败："+(e&&e.message||e));
    alert(e&&e.message||"扫描失败");
  }
  St.busy=false;refreshLibInfo();refreshModeHint();
}
async function dropFilesToLib(fileList,isDir){
  if(St.busy)return;
  St.mode="B";St.rootName="";St.rootHandle=null;
  St.busy=true;refreshLibInfo();
  try{
    let ents;
    if(isDir){ ents=await walkDropEntries(fileList); if(ents===null) ents=[]; }
    else ents=scanModeBFromFileList(fileList);
    if(!ents.some(e=>!e.img)){log("没有 TXT 文件");St.busy=false;refreshLibInfo();return;}
    const res=await scanModeB(ents);
    setBooks(res.books,0);
    log("拖入/选择："+res.books.length+" 本");
    goStep(1);
  }catch(e){log("读取出错："+(e&&e.message||e));}
  St.busy=false;refreshLibInfo();refreshModeHint();
}

function openFileDialog(){
  if(St.busy)return;
  const inp=document.createElement("input");
  inp.type="file";inp.multiple=true;
  inp.accept=".txt,text/plain,.text";
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
  /* iOS Safari 两个硬要求，缺一条选择器就打不开：
     ① input 必须真的插进文档 —— 游离节点的 .click() 在 iOS 上无效；
     ② 必须 addEventListener —— 给 .onchange 赋值在 iOS 上不触发。
     这两条是 iOS 用户「点了没反应」的直接原因，别改回去。 */
  document.body.appendChild(inp);
  inp.addEventListener("change",()=>{
    const fs=Array.from(inp.files||[]);
    setTimeout(()=>{try{inp.remove();}catch(e){}},0);
    if(fs.length)dropFilesToLib(fs,false);
  });
  inp.click();
}
function bindDrop(){
  const dz=$("dz");
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();dz.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{
    e.preventDefault();e.stopPropagation();if(ev==="dragleave")dz.classList.remove("over");}));
  dz.addEventListener("drop",e=>{
    dz.classList.remove("over");
    const dt=e.dataTransfer;
    let hasDir=false;
    if(dt.items&&dt.items.length){
      for(const it of dt.items){const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();
        if(en&&en.isDirectory)hasDir=true;}
    }
    if(hasDir) dropFilesToLib(dt.items,true);
    else if(dt.files&&dt.files.length) dropFilesToLib(dt.files,false);
  });
  dz.addEventListener("click",()=>openFileDialog());
}

    let tip='';

      if(!rules.includes("punct")&&scan.lone) tip+=' · '+fill(T("loneHint"),{n:scan.lone});
      if(!rules.includes("unwrap")&&scan.blocks) tip+=' · '+fill(T("wrapHint"),{n:scan.blocks});

      +'<div class="pane"><div class="pt"><span>'+esc(T("rClean"))+'</span>'

      +(r.trimmed?(' · '+(T("cutStat")||"另 {m} 行只裁了行尾").replace(/\{m\}/,r.trimmed)):'')
      +(r.jsdup?(' · '+(T("jsdupStat")||"其中简繁重复 {n} 行").replace(/\{n\}/,r.jsdup)):'')
      +(r.merged?(' · '+(T("mergeStat")||"合并断行 {n} 处").replace(/\{n\}/,r.merged)):'')
      +(r.glued?(' · '+(T("glueStat")||"标点接回上一行 {n} 处").replace(/\{n\}/,r.glued)):'')
      +(r.wrapSkip?(' · '+(T("wrapSkipStat")||"{n} 段过长未合并").replace(/\{n\}/,r.wrapSkip)):'')+tip+'</span></div>'

async function tryChapters(){
  const b=chapBookObj();
  if(!b){setMsgHint($("chapInfo"),T("chApplyNeed"));return;}
  storeBookRegex();
  const custom=(b.chapRe||$("chapRegex").value).trim();
  let reOk=true;
  if(custom){try{new RegExp(custom);}catch(e){reOk=false;}}
  if(!reOk){setMsgHint($("chapInfo"),T("chBadRegex"));return;}
  let raw=(bookSource(b)!==undefined?bookSource(b):await bookText(b))||"";
  /* 与 EXE 版及导出逻辑一致：未应用清洗时按当前规则临时清洗一份再分章
     （不写入 b._clean，避免影响清洗页的统计与“应用清洗”流程） */
  if(b._clean===undefined){
    const rules=activeRuleIds();
    if(rules.length) raw=Core.cleanText(raw,rules,false,St.customRules).text;
  }
  let chs;
  try{chs=Core.splitChapters(raw,custom);}catch(e){setMsgHint($("chapInfo"),T("chBadRegex"));return;}
  window._lastTry={chs,b};
  renderChapList(chs);
  $("chapInfo").textContent=fill(T("chTryDone"),{n:chs.length,c:fmtNum(Core.countChars(raw))});
  log(fill(T("logChapped"),{name:b.title||b.name,n:chs.length})+"（试分）");
}
function renderChapList(chs){

  chs.slice(0,400).forEach((c,i)=>{
    const d=document.createElement("div");d.className="ch";
    d.textContent=(i+1)+". "+c.t+"（"+fmtNum(Core.countChars(c.b))+"字）";
    d.title=c.t;box.appendChild(d);

function applyChapters(){

  const b=t.b;b._chap=t.chs;b.chapters=t.chs.length;

async function chapAll(){
  const info=$("chapAllInfo");const btn=$("btnChapAll");
  if(!St.books.length){info.textContent=T("chAllEmpty");return;}
  const custom=$("chapRegex").value.trim();
  if(custom){try{new RegExp(custom);}catch(e){$("chapInfo").textContent=T("chBadRegex");return;}}
  btn.disabled=true;info.textContent="";
  const n=St.books.length;let done=0,sum=0;
  for(let i=0;i<n;i++){
    const b=St.books[i];
    info.textContent=fill(T("chAllDoing"),{i:i+1,n,name:(b.title||b.name).slice(0,24)});
    try{
      let raw=(bookSource(b)!==undefined?bookSource(b):await bookText(b))||"";
      if(b._clean===undefined){
        const rules=activeRuleIds();
        if(rules.length) raw=Core.cleanText(raw,rules,false,St.customRules).text;
      }
      // 这本书自己设了规则就用自己的，否则用全局
      let own=(b.chapRe||custom||"").trim()||undefined;
      if(own){try{new RegExp(own);}catch(e){own=undefined;}}
      const chs=Core.splitChapters(raw,own);
      b._chap=chs;b.chapters=chs.length;sum+=chs.length;done++;
    }catch(e){log("分章失败："+b.name+" "+e.message);}
    if(i%5===4||i===n-1){renderLib();fillChapBook();}
  }
  renderLib();fillChapBook();
  btn.disabled=false;
  const msg=fill(T("chAllDone"),{n:done,m:sum});
  info.textContent=msg;
  log(msg);
}

/* 把同目录的同名图片挂到书上（目录模式与拖拽模式共用一套匹配规则） */
function attachCovers(books,imgs){
  if(!imgs||!imgs.length)return 0;
  const map=new Map();
  for(const im of imgs) map.set(relDir(im.rel)+"|"+relStem(im.rel),im);
  let hit=0;
  for(const b of books){
    const dir=relDir(b.rel);
    const stem=String(b.name||"").replace(/(?:\.(?:txt|text))+$/i,"").trim().toLowerCase();
    const title=String(b.title||"").trim().toLowerCase();
    const cands=[stem,stem+".cover",stem+"-cover",stem+"_cover"];
    if(title&&title!==stem) cands.push(title,title+".cover",title+"-cover",title+"_cover");
    for(const c of cands){const got=map.get(dir+"|"+c);if(got){b.coverEnt=got;hit++;break;}}
  }
  return hit;
}
/* 这本书要用的封面：同名图片优先，退回画布生成的默认封面 */
async function bookCover(b){
  const mode=coverMode();
  if(mode==="none")return null;
  if(mode!=="default"&&b.coverEnt){
    try{
      const ent=b.coverEnt;
      const f=ent.handle?await ent.handle.getFile():ent.file;
      const c=await Core.prepareCoverFile(f);
      if(c)return c;
    }catch(e){log("⚠ 封面图读取失败："+(e&&e.message||e));}
  }
  return await Core.makeCover(b.title||fileBaseName(b),b.author||"");
}

async function runExport(){
  if(St.busy)return;
  const sel=selectedBooks();
  if(!sel.length){showMsg("outMsg","warn",T("runNone"));return;}
  const fmts=[];
  if($("fmtEpub").checked)fmts.push("epub");
  if($("fmtTxt").checked)fmts.push("txt");
  if($("fmtSplit").checked)fmts.push("split");
  if(!fmts.length){showMsg("outMsg","warn",T("fmtNeed"));return;}
  const skipDup=$("optSkipDup").checked;
  const inplace=!!($("optInplace")&&$("optInplace").checked);
  if(inplace&&!St.rootHandle){showMsg("outMsg","warn",T("needRootDir"));return;}
  if(inplace&&!fmts.includes("txt")){showMsg("outMsg","warn",T("inplaceNoTxt"));return;}
  if(inplace&&!activeRuleIds().length){showMsg("outMsg","warn",T("inplaceNoRule"));return;}
  if(inplace){
    try{
      const p=await St.rootHandle.queryPermission({mode:"readwrite"});
      if(p!=="granted"){
        const r=await St.rootHandle.requestPermission({mode:"readwrite"});
        if(r!=="granted"){showMsg("outMsg","warn",T("needWritePerm"));return;}
      }
    }catch(e){ showMsg("outMsg","warn",T("needWritePerm"));return; }
  }
  const toDir=!!St.saveDir;
  const dir=St.saveDir;
  showMsg("outMsg","ok",fill(T("runStart"),{n:sel.length})+(toDir?" → 📁 "+esc(St.saveDirName):""));
  St.busy=true;refreshLibInfo();
  const pb=$("progBar");pb.style.display="block";pb.firstElementChild.style.width="0%";
  const tb=$("outTbl");const L=TX();
  tb.innerHTML="<tr><th>"+esc(L.thName)+"</th><th>"+esc(T("thStatus"))+"</th><th style='text-align:right'>"+esc(L.thSize)+"</th></tr>";
  let ok=0,fail=0,skip=0,fileN=0;
  for(let i=0;i<sel.length;i++){
    const b=sel[i];const row=document.createElement("tr");
    const tdN=document.createElement("td");tdN.className="name";tdN.textContent=b.title||b.name;
    const tdS=document.createElement("td");const tdZ=document.createElement("td");tdZ.className="num";
    row.appendChild(tdN);row.appendChild(tdS);row.appendChild(tdZ);
    tb.appendChild(row);
    pb.firstElementChild.style.width=((i/sel.length)*100)+"%";
    try{
      if(skipDup&&b._exported){skip++;tdS.textContent=T("dupYes");continue;}
      const base=fileBaseName(b);
      const chapters=await chaptersFor(b);
      const files=[];
      if(fmts.includes("epub")){
        const u8=await Core.buildEpub({title:b.title||base,author:b.author||"",chapters,
          theme:themeId(),cover:await bookCover(b)});
        files.push({name:base+".epub",data:u8,mime:"application/epub+zip"});
      }
      if(fmts.includes("txt")&&!inplace){
        const s=Core.buildMergedTxt(chapters);
        files.push({name:base+".txt",data:s,mime:"text/plain;charset=utf-8"});
      }
      if(fmts.includes("split")){
        const u8=await Core.buildSplitZip(base,chapters);
        files.push({name:base+"_分章.zip",data:u8,mime:"application/zip"});
      }
      const done=[];
      if(inplace){
        const text=await ensureCleaned(b);
        const r2=await writeBackBook(b,text);
        done.push(T("colInplace")+" "+r2.name);
        log(T("logInplace").replace("{f}",r2.name)+(r2.bak?T("logBakDone").replace("{f}",r2.bak):T("logBakSkip")));
      }
      if(files.length){
        if(toDir){for(const f of files){const t=await writeToDir(dir,f.name,f.data);done.push(t);log(T("saved").replace("{f}",t));}}
        else{for(const f of files){dlBytes(f.name,f.data,f.mime,false);fileN++;done.push(f.name);await sleep(150);}}
      }
      b._exported=true;
      tdS.textContent=done.length?done.join(" + "):"—";
      tdZ.textContent=Core.humanSize(files.reduce((n,f)=>n+blobSize(f),0));
      ok++;
      log(fill(T("logExported"),{name:b.title||b.name,f:files.map(f=>f.name).join(", ")}));
    }catch(e){
      fail++;tdS.textContent="✗ "+(e&&e.message||e);
      log("导出失败："+(b.title||b.name)+" — "+(e&&e.message||e));
    }
  }
  pb.firstElementChild.style.width="100%";
  await sleep(300);pb.style.display="none";
  St.busy=false;refreshLibInfo();refreshModeHint();
  showMsg("outMsg",fail?"warn":"ok",fill(T("runDone"),{ok,fail})+(skip?(" · "+fill(T("runSkipDup"),{n:skip})):""));
  log(fill(T("runDone"),{ok,fail}));
  if(!toDir&&ok&&fileN) log(T("dlMulti").replace("{n}",fileN));
  if(inplace&&ok){
    try{ await writeIndexA(St.rootHandle,St.rootName,St.books); }catch(e){}
    renderLib();
  }
  refreshOutInfoRowWarn();
}
function refreshOutInfoRowWarn(){}
function blobSize(f){return typeof f.data==="string"?new Blob([f.data]).size:f.data.length;}
async function writeToDir(dir,name,data){
  // 存在同名则追加 (1)(2)…
  let target=name;
  for(let n=1;;n++){
    let exists=true;
    try{await dir.getFileHandle(target);}catch(e){exists=false;}
    if(!exists)break;
    const dot=name.lastIndexOf(".");
    const stem=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):"";
    target=stem+" ("+n+")"+ext;
  }
  const hf=await dir.getFileHandle(target,{create:true});
  const w=await hf.createWritable();
  await w.write(data);
  await w.close();
  return target;
}
async function writeBackBook(b,text){
  // 沿 rel 找到这本书所在的目录
  const segs=(b.rel||b.name).split("/");segs.pop();
  let dir=St.rootHandle;
  for(const s of segs) dir=await dir.getDirectoryHandle(s);
  const name=(b.rel||b.name).split("/").pop();
  const bakName=name+".bak";
  let bak="";
  let exists=false;
  try{await dir.getFileHandle(bakName);exists=true;}catch(e){}
  if(!exists){
    const f=await b.handle.getFile();
    const bytes=new Uint8Array(await f.arrayBuffer());  // 原始字节，不重新编码
    const bh=await dir.getFileHandle(bakName,{create:true});
    const bw=await bh.createWritable();
    await bw.write(bytes);await bw.close();
    bak=bakName;
  }
  const w=await b.handle.createWritable();
  await w.write(new TextEncoder().encode(text));
  await w.close();
  // 覆盖后刷新这本书的缓存，免得书库还显示旧字数
  const f2=await b.handle.getFile();
  b.size=f2.size;b.mtime=Math.floor(f2.lastModified/1000);
  b._bytes=new Uint8Array(await f2.arrayBuffer());
  b._text=Core.decodeBytes(b._bytes,"utf-8");
  b._clean=b._text;b._chap=null;b._exported=true;
  b.chars=Core.countChars(b._text);
  b.sha=Core.sha256hex(b._bytes);b.md5=b.sha.slice(0,32);
  return {name,bak};
}

  $("btnLang").onclick=()=>setLang(CUR==="zh"?"en":"zh");
  $("btnAbout").onclick=()=>openModal(T("aboutTitle"),TX().aboutBody);
  $("btnHelp").onclick=()=>openModal(T("helpTitle"),TX().helpBody);
}
function bindRulesPack(){
  const a=$("btnRulesImport"),b=$("btnRulesExport"),c=$("btnRulesCustom");
  if(a) a.onclick=importRulesPack;
  if(b) b.onclick=exportRulesPack;
  if(c) c.onclick=editCustomRules;
}
function bindSteps(){
  $("btnCleanPrev").onclick=previewClean;
  $("btnCleanApply").onclick=applyClean;
  $("cleanReset").onclick=()=>{St.rulesOn=new Set(Core.DEFAULT_ON);buildRules();};
  $("btnChapTry").onclick=tryChapters;
  $("btnChapApply").onclick=applyChapters;
  $("btnChapAll").onclick=chapAll;
  const cbChap=$("chapBook"),inBook=$("bookRegex");
  if(cbChap) cbChap.onchange=()=>{syncBookRegex();refreshChapMsg();};
  if(inBook) inBook.oninput=()=>{storeBookRegex();
    $("bookRegex").title=inBook.value.trim()?T("bookReOn"):"";};
  $("chapReHelp").onclick=openReHelp;
  $("chapReset").onclick=()=>{$("chapRegex").value="";window._lastTry=null;
    renderChapList([]);$("chapInfo").textContent="";};
  $("btnRun").onclick=runExport;
  $("btnSaveDir").onclick=saveDirFlow;
  const ip=$("optInplace"),sf=$("savSuffix");
  if(ip) ip.onchange=()=>{cfgSet("inplace",ip.checked?"1":"0");refreshSavHint();};
  if(sf) sf.oninput=()=>{cfgSet("savSuffix",sf.value);};
  const thEl=$("selTheme"),cvEl=$("selCover");
  if(thEl) thEl.onchange=()=>cfgSet("theme",thEl.value);
  if(cvEl) cvEl.onchange=()=>cfgSet("cover",cvEl.value);
}

/* ================= 启动 ================= */
async function boot(){
  const savedLang=cfgKey("lang");
  if(savedLang==="en"||savedLang==="zh")CUR=savedLang;
  applyStatic();bindNav();bindLib();bindDrop();bindTop();bindSteps();bindRulesPack();buildRules();
  if(cfgKey("savSuffix")!==null&&$("savSuffix")) $("savSuffix").value=cfgKey("savSuffix");
  if(cfgKey("inplace")==="1"&&$("optInplace")) $("optInplace").checked=true;
  refreshThemeSelect();refreshCoverSelect();
  try{
    const cr=cfgKey("customRules");
    if(cr){const arr=JSON.parse(cr);if(Array.isArray(arr))St.customRules=arr;}
  }catch(e){}
  if(cfgKey("theme")&&$("selTheme")) $("selTheme").value=cfgKey("theme");
  if(cfgKey("cover")&&$("selCover")) $("selCover").value=cfgKey("cover");
  refreshModeHint();refreshLibInfo();refreshOutInfo();
  // 恢复上次目录授权
  const rh=await idbGet("rootHandle");
  const nm=cfgKey("rootName");
  if(rh&&nm){
    St.rootHandle=rh;St.rootName=nm;St.mode="A";
    const wrap=$("btnPickFiles");
    const btn=document.createElement("button");
    btn.className="btn ghost";btn.id="btnReopen";
    btn.innerHTML=T("memReuse")+' <span style="opacity:.6;font-size:12px">· '+esc(nm)+'</span>';
    btn.style.cssText="margin-left:2px";
    btn.onclick=async()=>{
      try{const p=await rh.queryPermission({mode:"readwrite"});
        if(p!=="granted")await rh.requestPermission({mode:"readwrite"});}catch(e){}
      pickDirFlow(false);
    };
    wrap.parentNode.insertBefore(btn,wrap.nextSibling);
    log("可重新打开上次目录："+nm);
  }
  // 恢复输出目录授权
  const sd=await idbGet("saveDir");
  if(sd){St.saveDir=sd;try{St.saveDirName=sd.name;}catch(e){}}
  // 初始日志
  log("卷帙 DeShelf Web v1.0 就绪。"+(canDir?"（本浏览器支持目录模式）":"（本浏览器不支持目录模式，将使用文件/拖拽模式）"));
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
